# ============================================
# DATABASE - Neon (PostgreSQL)
# ============================================
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:dev-secret-change-in-production}
jwt.expiration-ms=86400000

# ============================================
# CoinGecko API
# ============================================
coingecko.api.base-url=${COINGECKO_API_BASE_URL:https://api.coingecko.com/api/v3}

# ============================================
# Scheduler
# ============================================
app.scheduler.price-refresh-interval=60000
app.scheduler.alert-check-interval=30000

# ============================================
# CORS
# ============================================
cors.allowed-origins=*

# ============================================
# Server
# ============================================
server.port=8080
