<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm">
  @for (toast of toastService.toastsSignal(); track toast.id) {
    <div class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-2xl border animate-slide-in"
         [class.bg-error/90]="toast.type === 'error'"
         [class.border-error/50]="toast.type === 'error'"
         [class.bg-secondary/90]="toast.type === 'success'"
         [class.border-secondary/50]="toast.type === 'success'"
         [class.bg-warning/90]="toast.type === 'warning'"
         [class.border-warning/50]="toast.type === 'warning'"
         [class.bg-primary/90]="toast.type === 'info'"
         [class.border-primary/50]="toast.type === 'info'"
         [class.text-on-error]="toast.type === 'error'"
         [class.text-on-secondary]="toast.type === 'success'"
         [class.text-on-warning]="toast.type === 'warning'"
         [class.text-on-primary]="toast.type === 'info'">
      <span class="material-symbols-outlined text-lg flex-shrink-0">
        @switch (toast.type) {
          @case ('error') { error }
          @case ('success') { check_circle }
          @case ('warning') { warning }
          @case ('info') { info }
        }
      </span>
      <p class="text-[13px] font-medium flex-1">{{ toast.message }}</p>
      <button (click)="toastService.dismiss(toast.id)" class="opacity-70 hover:opacity-100 transition-opacity flex-shrink-0">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
  }
</div>
