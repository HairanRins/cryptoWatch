<div class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden px-4 py-8">
  <!-- Background Decorative Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px]"></div>
  </div>

  <div class="relative w-full max-w-[440px] z-10">
    <!-- Logo Area -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center mb-4 inner-stroke">
        <span class="material-symbols-outlined text-on-primary-container text-[32px]">account_balance_wallet</span>
      </div>
      <h1 class="text-3xl font-semibold text-on-surface tracking-tight">CryptoWatch</h1>
      <p class="text-sm text-on-surface-variant mt-1">Institutional Grade Asset Terminal</p>
    </div>

    <!-- Login Card -->
    <div class="glass-panel inner-stroke rounded-xl p-8">
      <h2 class="text-2xl font-semibold mb-6 text-primary">Welcome Back</h2>

      <form class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label class="text-xs font-bold tracking-wider text-on-surface-variant block" for="login_email">EMAIL ADDRESS</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
            <input class="w-full bg-background border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-3 pl-12 pr-4 text-on-surface text-base placeholder:text-outline transition-all" id="login_email" placeholder="name@company.com" type="email"/>
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold tracking-wider text-on-surface-variant block" for="login_password">PASSWORD</label>
            <a class="text-xs font-bold tracking-wider text-primary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
            <input class="w-full bg-background border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-3 pl-12 pr-12 text-on-surface text-base placeholder:text-outline transition-all" id="login_password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" type="password"/>
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center gap-2">
          <input class="w-4 h-4 rounded border-outline-variant bg-background text-primary focus:ring-primary focus:ring-offset-background" id="remember" type="checkbox"/>
          <label class="text-sm text-on-surface-variant cursor-pointer select-none" for="remember">Stay logged in</label>
        </div>

        <!-- Sign In Button -->
        <button class="w-full bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] text-on-primary-container font-semibold text-base py-3 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
          Sign In
          <span class="material-symbols-outlined">login</span>
        </button>
      </form>

      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
        <div class="relative flex justify-center"><span class="bg-surface-container px-4 text-xs font-bold tracking-wider text-outline">OR CONTINUE WITH</span></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 py-3 rounded-lg transition-colors">
          <img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8hXnOpUUUZw5gNUyTX9LMkSuCY68CCRpqKbOiyYVLupKnlsyqKvrrTsJ3r-90_gjFCZ_BC05ghdhJytcMJZrzhYz6Cs4blfvgRcJbjJorfLYqrV23dlaCbDc4CMGTELkNm70FcZoFefDeV7snRe7RNzIYYJWU-XQlNED0oNPLbpHZaGjff1p0poLdLe7jVu0u4M7-wyx7dJVrFxakz5TgAlXANotWZxUNU2MZLmlW-aFwDtt-Pxw3QYEiT5qCQsOTJEFG6A9nazyo"/>
          <span class="text-xs font-bold tracking-wider text-on-surface">GOOGLE</span>
        </button>
        <button class="flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 py-3 rounded-lg transition-colors">
          <span class="material-symbols-outlined">key</span>
          <span class="text-xs font-bold tracking-wider text-on-surface">SSO</span>
        </button>
      </div>
    </div>

    <!-- Footer Link -->
    <p class="text-center mt-8 text-base text-on-surface-variant">
      Don't have an account?
      <a routerLink="/signup" class="text-primary font-bold hover:underline decoration-primary/30 underline-offset-4">Sign up for CryptoWatch</a>
    </p>

    <!-- System Status Mini-Card -->
    <div class="mt-6 glass-panel inner-stroke rounded-full px-6 py-2 flex items-center justify-between border-white/5">
      <div class="flex items-center gap-2">
        <span class="flex h-2 w-2 rounded-full bg-secondary"></span>
        <span class="text-xs font-bold tracking-wider text-on-surface-variant">SYSTEMS OPERATIONAL</span>
      </div>
      <span class="text-sm font-mono font-medium text-secondary">v1.0.4-STABLE</span>
    </div>
  </div>
</div>
